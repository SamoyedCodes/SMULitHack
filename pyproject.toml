[project]
name = "smu-lit-hack"
version = "0.1.0"
description = "SMU Lit Hackathon"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "pydantic==2.13.5",
    "python-multipart==0.0.32",
    "pymupdf==1.28.2",
    "pytesseract==0.3.13",
    "google-genai==2.22.0",
    "python-dotenv==1.2.3",
    "reportlab>=4.4,<5",
    "python-docx>=1.2,<2",
    "Pillow>=11,<13",
    "httpx==0.28.1",
    "pytest==9.1.1"
]

[tool.vercel]
entrypoint = "backend.api:app"
